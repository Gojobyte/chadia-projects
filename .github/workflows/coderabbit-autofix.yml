# CodeRabbit Auto-Fix Workflow
# Applique automatiquement les suggestions de CodeRabbit au push sur main
# Nécessite : CodeRabbit GitHub App installé + token CR_PAT

name: CodeRabbit Auto-Fix

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  coderabbit-fix:
    name: CodeRabbit Auto-Fix
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint fix
        run: npx eslint . --fix --ext .ts,.tsx,.js,.jsx || true

      - name: Run Prettier
        run: npx prettier --write "**/*.{ts,tsx,js,jsx,json,css,md}" || true

      - name: Auto-commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: apply auto-fixes (ESLint + Prettier)"
          commit_user_name: "CodeRabbit Bot"
          commit_user_email: "bot@coderabbit.ai"

  coderabbit-review:
    name: CodeRabbit Review
    runs-on: ubuntu-latest
    steps:
      - name: CodeRabbit Review
        uses: coderabbitai/Standalone@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          CR_REVIEW_ONLY: "true"
