version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chadia
      POSTGRES_PASSWORD: chadia_secret
      POSTGRES_DB: chadia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chadia"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  auth-service:
    build: ./services/auth
    environment:
      DATABASE_URL: postgresql://chadia:chadia_secret@postgres:5432/chadia?schema=auth
      REDIS_URL: redis://redis:6379
      JWT_SECRET: chadia-jwt-secret-local
      INTERNAL_SERVICE_TOKEN: internal-service-token-local
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  tender-service:
    build: ./services/tender
    environment:
      DATABASE_URL: postgresql://chadia:chadia_secret@postgres:5432/chadia?schema=tender
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:3001
      NOTIFICATION_SERVICE_URL: http://notification-service:3003
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build: ./services/notification
    environment:
      DATABASE_URL: postgresql://chadia:chadia_secret@postgres:5432/chadia?schema=notification
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PORT: 3003
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build: ./services/gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      TENDER_SERVICE_URL: http://tender-service:3002
      NOTIFICATION_SERVICE_URL: http://notification-service:3003
      INTERNAL_SERVICE_TOKEN: internal-service-token-local
      NEXTAUTH_SECRET: chadia-nextauth-secret-local
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - tender-service
      - notification-service
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
